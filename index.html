<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur de Revenus — France 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f7;
      color: #1a1a2e;
      min-height: 100vh;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 36px 28px;
    }

    header { margin-bottom: 28px; }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #111827;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* ─── Controls ──────────────────────────────────── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
      background: white;
      padding: 20px 24px;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field > label, .field-label {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field input[type="number"],
    .field select {
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      padding: 9px 13px;
      font-size: 15px;
      color: #111827;
      background: white;
      outline: none;
      transition: border-color 0.15s;
      min-width: 160px;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .field input[type="number"]::-webkit-inner-spin-button { opacity: 0.5; }
    .field input:focus, .field select:focus { border-color: #818cf8; }

    .checkbox-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 0 2px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: #6366f1;
      flex-shrink: 0;
    }

    .checkbox-row label {
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
    }

    .checkbox-hint {
      font-size: 11px;
      color: #9ca3af;
      padding-left: 26px;
    }

    /* ─── Main grid ─────────────────────────────────── */
    .main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items: start;
    }

    /* ─── Chart card ─────────────────────────────────── */
    .chart-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      padding: 24px 28px 20px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 600;
      color: #374151;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #6b7280;
    }

    .legend-line {
      width: 22px;
      height: 2.5px;
      border-radius: 2px;
    }

    .chart-wrap {
      position: relative;
      height: 430px;
    }

    .hint {
      font-size: 12px;
      color: #c4c9d4;
      text-align: center;
      margin-top: 12px;
      user-select: none;
    }

    /* ─── Details panel ──────────────────────────────── */
    .details-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      padding: 22px 22px;
      position: sticky;
      top: 24px;
    }

    .details-title {
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 16px;
    }

    .detail-row {
      margin-bottom: 14px;
    }

    .detail-row label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .detail-val {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
    }

    .detail-val.em-negative { color: #ef4444; }
    .detail-val.em-positive { color: #22c55e; }
    .detail-val.em-total    { color: #6366f1; font-size: 21px; }

    .rate-row {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
    }

    .rate-item { flex: 1; }

    .rate-item label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .rate-val {
      font-size: 17px;
      font-weight: 700;
      color: #111827;
    }

    .divider {
      height: 1px;
      background: #f3f4f6;
      margin: 4px 0 14px;
    }

    .placeholder {
      color: #d1d5db;
      font-size: 15px;
      font-weight: 400;
    }

    /* ─── Cotisations breakdown ──────────────────────── */
    .cot-block { margin-bottom: 14px; }

    .cot-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      cursor: pointer;
      user-select: none;
    }

    .cot-header-label {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .cot-chevron {
      font-size: 9px;
      color: #c4c9d4;
      transition: transform 0.18s;
    }

    .cot-block.open .cot-chevron { transform: rotate(180deg); }

    .cot-total {
      font-size: 18px;
      font-weight: 700;
      color: #ef4444;
    }

    .cot-list {
      display: none;
      margin-top: 8px;
      border-top: 1px solid #f3f4f6;
      padding-top: 6px;
    }

    .cot-block.open .cot-list { display: block; }

    .cot-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 4px 0;
      font-size: 12px;
    }

    .cot-row-label { color: #6b7280; }

    .cot-row-sub {
      display: block;
      font-size: 10px;
      color: #9ca3af;
      margin-top: 1px;
    }

    .cot-row-val {
      font-weight: 600;
      color: #f87171;
      font-size: 12px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* ─── SMIC badge ─────────────────────────────────── */
    .smic-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #6366f1;
      background: #eef2ff;
      border-radius: 4px;
      padding: 1px 6px;
      vertical-align: middle;
      margin-left: 6px;
      letter-spacing: 0.05em;
    }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
      .details-card { position: static; }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <h1>Calculateur de Revenus</h1>
    <p class="subtitle">
      Simulation du revenu net total — France 2026 · PMSS 4 005 €
    </p>
  </header>

  <div class="controls">
    <div class="field">
      <label>Nombre de parts fiscales</label>
      <input type="number" id="nbParts" value="1" min="0.5" max="10" step="0.5">
    </div>
    <div class="field">
      <label>Statut</label>
      <select id="status">
        <option value="cadre">Cadre</option>
        <option value="non-cadre">Non-cadre</option>
      </select>
    </div>
    <div class="checkbox-wrap">
      <div class="field-label">Aides sociales</div>
      <div class="checkbox-row">
        <input type="checkbox" id="includeAids" checked>
        <label for="includeAids">Inclure les aides sociales</label>
      </div>
      <div class="checkbox-hint">RSA &amp; Prime d'activité (barème avril 2026)</div>
    </div>
  </div>

  <div class="main">

    <!-- Chart -->
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Entrée nette en fonction du salaire brut</div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="chart-wrap">
        <canvas id="myChart"></canvas>
      </div>
      <p class="hint">Survolez le graphique pour voir les détails</p>
    </div>

    <!-- Details panel -->
    <div class="details-card">
      <div class="details-title">
        Détails
        <span id="grossBadge" class="smic-badge" style="display:none"></span>
      </div>

      <div class="detail-row">
        <label>Salaire brut mensuel</label>
        <div class="detail-val" id="dGross"><span class="placeholder">—</span></div>
      </div>

      <!-- Cotisations (collapsible) -->
      <div class="cot-block" id="cotBlock">
        <div class="cot-header" id="cotToggle">
          <div class="cot-header-label">
            Cotisations salariales
            <span class="cot-chevron" id="cotChevron">▼</span>
          </div>
          <div class="cot-total" id="dCot"><span class="placeholder">—</span></div>
        </div>
        <div class="cot-list" id="cotList"></div>
      </div>

      <div class="detail-row">
        <label>Salaire net (après cotisations)</label>
        <div class="detail-val" id="dNet"><span class="placeholder">—</span></div>
      </div>

      <div class="divider"></div>

      <div class="detail-row">
        <label>Impôt sur le revenu (mensuel)</label>
        <div class="detail-val em-negative" id="dTax"><span class="placeholder">—</span></div>
      </div>

      <div class="rate-row">
        <div class="rate-item">
          <label>Taux effectif</label>
          <div class="rate-val" id="dRateEff"><span class="placeholder">—</span></div>
        </div>
        <div class="rate-item">
          <label>TMI</label>
          <div class="rate-val" id="dRateTMI"><span class="placeholder">—</span></div>
        </div>
      </div>

      <div class="divider" id="aidsDivider"></div>
      <div class="detail-row" id="aidsRow">
        <label>Total aides sociales (mensuel)</label>
        <div class="detail-val em-positive" id="dAids"><span class="placeholder">—</span></div>
      </div>

      <div class="divider"></div>

      <div class="detail-row">
        <label>Revenu total mensuel</label>
        <div class="detail-val em-total" id="dTotal"><span class="placeholder">—</span></div>
      </div>
    </div>

  </div>
</div>

<!-- Business logic (no DOM) -->
<script src="calculator.js"></script>
<!-- UI layer (chart + DOM wiring) -->
<script src="app.js"></script>
</body>
</html>
